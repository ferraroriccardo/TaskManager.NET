# Start the whole stack with:   docker compose up -d --build
#   - db   -> PostgreSQL           (localhost:5432)
#   - api  -> ASP.NET Core Web API (http://localhost:5080, API UI at /scalar)
#   - web  -> React served by nginx (http://localhost:5173)
#
# Useful commands:
#   docker compose ps                 container status
#   docker compose logs -f api        backend logs (with the SQL queries generated by EF Core)
#   docker compose down               stops everything (data stays in the volume)
#   docker compose down -v            stops everything and DELETES the database (restarts with the sample data)

services:
  db:
    image: postgres:17
    container_name: taskmanager-db
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager   # local development only!
    ports:
      - "5432:5432"                    # also exposed outside, for pgAdmin / DBeaver / local dotnet run
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives "docker compose down"
    healthcheck:                       # "ready" only when Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/TaskManager.Api
    container_name: taskmanager-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables /scalar and /openapi
      # Overrides "ConnectionStrings:Default" from appsettings.json ("__" = ":").
      # Inside the Docker network the database is reached by SERVICE NAME ("db"), not via localhost.
      ConnectionStrings__Default: "Host=db;Port=5432;Database=taskmanager;Username=taskmanager;Password=taskmanager"
    ports:
      - "5080:8080"                    # host:container (.NET images listen on 8080)
    depends_on:
      db:
        condition: service_healthy     # waits until Postgres is really ready, not just started

  web:
    build:
      context: ./frontend
      args:
        # The React code runs in the BROWSER, not inside Docker: so the API is called via localhost.
        VITE_API_URL: http://localhost:5080
    container_name: taskmanager-web
    ports:
      - "5173:80"                      # same port as "npm run dev", so the CORS policy stays valid
    depends_on:
      - api

volumes:
  pgdata:
